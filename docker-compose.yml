services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ankuaru
      POSTGRES_USER: ankuaru
      POSTGRES_PASSWORD: ankuaru
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ankuaru -d ankuaru"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ankuaru-postgres:/var/lib/postgresql/data

volumes:
  ankuaru-postgres:
